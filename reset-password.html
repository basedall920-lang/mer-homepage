
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MER ADMIN | パスワード再設定</title>
  <style>
    body{margin:0;background:#f1f4f9;font-family:Arial,sans-serif;color:#172235;min-height:100vh;display:grid;place-items:center}
    main{background:white;padding:32px;border-radius:20px;width:min(85%,420px);box-shadow:0 10px 30px #0001}
    h1{font-size:26px}
    label{display:block;margin:20px 0 8px;font-weight:bold}
    input{box-sizing:border-box;width:100%;padding:15px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}
    button{width:100%;margin-top:25px;padding:16px;background:#3266ae;color:white;border:0;border-radius:9px;font-size:17px;font-weight:bold}
    button:disabled{opacity:.5}
    #status{line-height:1.7;color:#52627a}
  </style>
</head>
<body>
<main>
  <h1>MER ADMIN</h1>
  <p>新しいパスワードを設定</p>
  <form id="form">
    <label for="password">新しいパスワード（8文字以上）</label>
    <input id="password" type="password" minlength="8" autocomplete="new-password" required>
    <label for="confirm">パスワード確認</label>
    <input id="confirm" type="password" minlength="8" autocomplete="new-password" required>
    <button id="save" type="submit" disabled>パスワードを変更する</button>
  </form>
  <p id="status">再設定リンクを確認しています...</p>
</main>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://blpjbqrwfuwaaitoraib.supabase.co";
const SUPABASE_KEY = "sb_publishable_4AeMtLbC9eOyOCe8FwIuuA_qDA26qXI";
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const status = document.getElementById("status");
const button = document.getElementById("save");
let authorized = false;

supabase.auth.onAuthStateChange((event) => {
  if (event === "PASSWORD_RECOVERY") {
    authorized = true;
    button.disabled = false;
    status.textContent = "新しいパスワードを入力してください。";
  }
});

const params = new URLSearchParams(location.search);
const code = params.get("code");
if (code) {
  const { error } = await supabase.auth.exchangeCodeForSession(code);
  if (error) status.textContent = "リンクが無効か期限切れです。再発行してください。";
  else {
    authorized = true;
    button.disabled = false;
    status.textContent = "新しいパスワードを入力してください。";
  }
} else if (!location.hash.includes("access_token")) {
  status.textContent = "再設定メールのリンクから開いてください。";
}

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!authorized) return;
  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;
  if (password !== confirm) {
    status.textContent = "パスワードが一致しません。";
    return;
  }
  button.disabled = true;
  const { error } = await supabase.auth.updateUser({ password });
  if (error) {
    status.textContent = "変更できませんでした：" + error.message;
    button.disabled = false;
    return;
  }
  status.textContent = "変更完了！管理者ログイン画面に戻ってください。";
  await supabase.auth.signOut();
});
</script>
</body>
</html>
